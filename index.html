<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Memory Card Game</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="script/style.css">

</head>

<body>
  <div class="page-wrap">
    <header>
      <h1>Memory Match Game</h1>
      <div class="controls">
        <div class="stats">
          <span>Time: <strong id="time">0</strong>s</span>
          <span>Moves: <strong id="moves">0</strong></span>
          <span>Best: <strong id="best">--</strong>s</span>
        </div>
        <div class="buttons">
          <button id="restart">Restart</button>
          <button id="mute">🔊</button>
        </div>
      </div>
    </header>

    <main>
      <div class="game-container" id="game"></div>
    </main>

    <footer>
      <p class="credit">Built with HTML5 · CSS3 · JavaScript</p>
    </footer>


    <div class="modal-overlay" id="modal">
      <div class="modal-content">
        <h2>Victory! 🎉</h2>
        <div class="modal-stats">
          <p>You finished in <strong><span id="final-time">0</span>s</strong></p>
          <p>Moves taken: <strong><span id="final-moves">0</span></strong></p>
          <p id="new-best" style="display:none; color:#10b981; font-weight:bold; margin-top:10px;">New Personal Best! 🏆
          </p>
        </div>
        <button id="modal-restart">Play Again</button>
      </div>
    </div>
  </div>

  <script src="script/memory.js"></script>
</body>

</html>
