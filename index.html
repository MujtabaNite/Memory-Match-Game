<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Premium Memory Match</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <!-- Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="script/style.css">
</head>

<body>
  <!-- Ambient Background -->
  <div class="ambient-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="page-wrap">
    <header class="glass-panel">
      <h1>Memory Match</h1>
      <div class="controls">
        <div class="stats">
          <div class="stat-badge">
            <span class="label">Time</span>
            <div><strong id="time">0</strong><span class="unit">s</span></div>
          </div>
          <div class="stat-badge">
            <span class="label">Moves</span>
            <div><strong id="moves">0</strong></div>
          </div>
          <div class="stat-badge">
            <span class="label">Best</span>
            <div><strong id="best">--</strong><span class="unit">s</span></div>
          </div>
        </div>
        <div class="buttons">
          <button id="restart" class="btn primary">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
            Restart
          </button>
          <button id="mute" class="btn icon-btn">🔊</button>
        </div>
      </div>
    </header>

    <main>
      <div class="game-container glass-panel" id="game"></div>
    </main>

    <footer>
      <p class="credit">BY MUHAMMAD MUJTABA</p>
    </footer>

    <div class="modal-overlay" id="modal">
      <div class="modal-content glass-panel-heavy">
        <div class="modal-icon">🎉</div>
        <h2>Exceptional!</h2>
        <div class="modal-stats">
          <div class="modal-stat-item">
            <span class="modal-stat-label">Time</span>
            <span class="modal-stat-val"><span id="final-time">0</span>s</span>
          </div>
          <div class="modal-stat-item">
            <span class="modal-stat-label">Moves</span>
            <span class="modal-stat-val" id="final-moves">0</span>
          </div>
        </div>
        <div id="new-best" class="new-best-badge" style="display:none;">
          🏆 New Personal Best!
        </div>
        <button id="modal-restart" class="btn primary large">Play Again</button>
      </div>
    </div>
  </div>

  <!-- Particle Container -->
  <div id="particles-container"></div>

  <script src="script/memory.js"></script>
</body>

</html>
